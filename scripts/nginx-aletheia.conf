# Reverse proxy avaterra.pro — кеш только для неизменяемой статики.
# HTML/RSC/API — без proxy_cache (см. location /).
#
# Установка на VPS:
#   1) scripts/nginx-aletheia-http-snippet.conf → /etc/nginx/conf.d/aletheia-cache-maps.conf
#   2) Этот файл → sites-available/aletheia, nginx -t, reload.
#
# Карта кеша (уже на проде): proxy_cache_path ... keys_zone=mycache:10m ...

limit_req_zone $binary_remote_addr zone=aletheia:10m rate=25r/s;

server {
    if ($host = www.avaterra.pro) {
        return 301 https://avaterra.pro$request_uri;
    }
    if ($host = avaterra.pro) {
        return 301 https://avaterra.pro$request_uri;
    }
    listen 80;
    server_name avaterra.pro www.avaterra.pro;
    return 404;
}

server {
    listen 443 ssl http2;
    server_name avaterra.pro www.avaterra.pro;

    ssl_certificate /etc/letsencrypt/live/avaterra.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avaterra.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 100m;

    # --- Неизменяемые чанки Next.js (hash в имени файла) ---
    location ~* ^/_next/static/ {
        proxy_cache mycache;
        proxy_cache_valid 200 365d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # --- Оптимизированные изображения Next (URL стабилен при тех же query) ---
    location ~* ^/_next/image {
        proxy_cache mycache;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 5m;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SCORM: только для авторизованных (nginx auth_request → Next.js) ---
    # ВАЖНО: auth_request не раскрывает переменные в аргументе — URI передаём заголовком
    location = /internal/scorm-auth-check {
        internal;
        proxy_pass http://127.0.0.1:3000/api/portal/scorm/access-check;
        proxy_set_header X-Original-URI $request_uri;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
    }

    location /uploads/scorm/ {
        auth_request /internal/scorm-auth-check;
        alias /opt/ALETHEIA/public/uploads/scorm/;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control $scorm_cache_control always;
        access_log off;
    }

    # --- Приватная статика: медиатека и видео-верификации — только с сессией ---
    location = /internal/uploads-auth-check {
        internal;
        proxy_pass http://127.0.0.1:3000/api/portal/uploads/access-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
    }

    location /uploads/media/ {
        auth_request /internal/uploads-auth-check;
        alias /opt/ALETHEIA/public/uploads/media/;
        add_header Cache-Control $uploads_cache_control always;
        access_log off;
    }

    location /uploads/verifications/ {
        auth_request /internal/uploads-auth-check;
        alias /opt/ALETHEIA/public/uploads/verifications/;
        add_header Cache-Control "private, no-store" always;
        access_log off;
    }

    # --- Маркeting / тарифы / probuzhdenie (public/images) ---
    location /images/ {
        alias /opt/ALETHEIA/public/images/;
        add_header Cache-Control $images_cache_control always;
        access_log off;
    }

    # --- Прочие upload (обложки товаров /uploads/services и т.п. — публичные);
    #     scorm/media/verifications перехватываются location'ами выше ---
    location /uploads/ {
        alias /opt/ALETHEIA/public/uploads/;
        add_header Cache-Control $uploads_cache_control always;
        access_log off;
    }

    # --- Telegram webhook: быстрый ответ без rate-limit (Telegram ждёт <60s, рекомендуется <1s) ---
    location = /api/portal/telegram/webhook {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        client_max_body_size 1m;
        proxy_buffering off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # --- Загрузки админки (SCORM ZIP может быть большим) ---
    location ~ ^/api/portal/admin/(courses/upload|media/upload|comms/upload) {
        client_max_body_size 2048m;
        limit_req zone=aletheia burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # --- Динамика: портал, API, HTML, RSC — без кеша ---
    location / {
        limit_req zone=aletheia burst=80 nodelay;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # next start -H 127.0.0.1: если приложение отдаёт Location на localhost, подменяем на публичный origin
        proxy_redirect http://localhost:3000/ https://avaterra.pro/;
        proxy_redirect https://localhost:3000/ https://avaterra.pro/;
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        proxy_hide_header Cache-Control;
        proxy_hide_header x-nextjs-cache;
        add_header Cache-Control "private, max-age=0, must-revalidate" always;
    }
}
