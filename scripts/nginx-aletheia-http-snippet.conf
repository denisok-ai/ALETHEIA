# Положить в /etc/nginx/conf.d/aletheia-cache-maps.conf
# (подхватится через include /etc/nginx/conf.d/*.conf в nginx.conf — отдельный include не нужен)
map $uri $scorm_cache_control {
    default                                 "public, max-age=2592000, immutable";
    ~^/uploads/scorm/.+\.html$              "public, max-age=3600";
    ~^/uploads/scorm/.+/defaultData\.js     "public, max-age=3600";
}

map $uri $images_cache_control {
    default "public, max-age=604800";
}

map $uri $uploads_cache_control {
    default "public, max-age=86400";
}

# Меньше stat() при частой раздаче SCORM/картинок с диска.
open_file_cache max=10000 inactive=120s;
open_file_cache_valid 90s;
open_file_cache_min_uses 2;
open_file_cache_errors on;
