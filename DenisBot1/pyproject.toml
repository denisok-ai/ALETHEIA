[project]
name = "avaterra-bot"
version = "0.1.0"
description = "Avaterra Telegram SMM Bot - automated content planning and publishing"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
    "aiogram>=3.10,<4.0",
    "aiohttp>=3.9,<4.0",
    "asyncpg>=0.29,<1.0",
    "redis>=5.0,<6.0",
    "apscheduler>=3.10,<4.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "python-json-logger>=2.0,<3.0",
    "tenacity>=8.2,<9.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.2,<6.0",
    "boto3>=1.34,<2.0",
    "datasketch>=1.6,<2.0",
    "pymorphy3>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
]

[project.scripts]
avaterra-bot = "avaterra_bot.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
