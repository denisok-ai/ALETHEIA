brand:
  name: "AVATERRA"
  domain: "https://avaterra.pro"
  big_idea: >-
    Тело помнит всё. Через внимательную работу с телом, эмоциями и подсознанием
    человек может лучше понять, где находится напряжение, и научиться снимать
    стресс экологичными практиками.
  positioning: >-
    Phygital-школа прикладного мышечного тестирования и кинезиологии. Не
    медицинская клиника. Корректная позиция: "мы не лечим, мы работаем со
    стрессом, эмоциональными причинами и телесным откликом".
  tone_of_voice: >-
    Тёплый, спокойный, уверенный, экспертный, бережный. Обращение на "вы".
    Звучит как опытная женщина-практик, которая объясняет сложные вещи простыми
    словами.
  tov_dos:
    - "Простые объяснения без перегруза терминами"
    - "Уважение к сомнениям читателя"
    - "Мягкий экспертный тон без давления"
    - "Связка: ситуация в жизни → реакция тела → эмоция/стресс → возможность исследовать через метод"
    - "Практические вопросы для самонаблюдения"
    - "Истории и метафоры: тело как честный собеседник, стресс как заряд, эмоция как незавершённая реакция"
  tov_donts:
    - "Диагнозы вида 'у вас точно психосоматика', 'это из-за мамы', 'мы вылечим'"
    - "Запугивание и давление"
    - "Обещания гарантированного результата"
    - "Прямые медицинские рекомендации"
    - "Избыточная эзотерика, если тема объясняется через стресс и физиологию"
    - "Раскрытие подробных протоколов и пошаговых скриптов платного курса"
  goals:
    - "Объяснять метод и переводить читателя в заявку, оплату или консультацию"
    - "Формировать доверие к мышечному тестированию как навыку"
    - "Удерживать тёплый ритм публикаций 7 дней в неделю"

author:
  name: "Татьяна Стрельцова"
  role: "Основательница школы AVATERRA, ведущий мастер, практик и преподаватель"
  facts:
    - "22+ года практики в кинезиологии и работе с подсознанием"
    - "Более 15 000 консультаций / выпускников по материалам проекта"
    - "Авторская интеграция: мышечное тестирование + Карта эмоций + регресс"
    - "Центральная фигура бренда: подход и материалы выстроены вокруг основательницы"
  voice_rules:
    - "Делать акцент на опыте, практике и живом сопровождении"
    - "Показывать мастера, который передаёт навык, а не идеального гуру"
    - "Использовать формулировки 'основательница школы', 'ведущий мастер', 'практик и преподаватель'"

audiences:
  - id: "tense_body"
    name: "Человек с телесным напряжением и усталостью"
    pains:
      - "Хроническая усталость, спина, голова, тревога, ощущение 'нет сил'"
    search:
      - "Понятное объяснение, почему тело реагирует, и простой первый шаг"
    angle: "Тело не враг, оно показывает, где накопился стресс"
    health_sensitive: true
  - id: "personal_crisis"
    name: "Человек в личном кризисе"
    pains:
      - "Отношения, деньги, страх будущего, самореализация, внутренний конфликт"
    search:
      - "Понимание причины и способ вернуться к себе"
    angle: "Иногда проблема не решается логикой, потому что тело держит старый заряд"
    health_sensitive: true
  - id: "specialists"
    name: "Помогающие специалисты (психологи, коучи, массажисты)"
    pains:
      - "Долгий поиск причины у клиента, сложность диагностики, желание усилить практику"
    search:
      - "Дополнительный диагностический инструмент, который ускоряет работу"
    angle: "Мышечное тестирование как дополнительный инструмент, который помогает быстрее найти корень запроса"
    health_sensitive: false
  - id: "skeptics"
    name: "Скептики"
    pains:
      - "Недоверие к эзотерике, страх 'самовнушения', желание понять механизм"
    search:
      - "Спокойное объяснение без мистики"
    angle: "Мы не гадаем, мы учимся наблюдать телесную обратную связь и калибровать ответы"
    health_sensitive: false
  - id: "spiritual"
    name: "Духовно ориентированные люди"
    pains:
      - "Потеря контакта с собой, поиск смысла, усталость от внешнего шума"
    search:
      - "Практики осознанности, сопровождение, внутренняя тишина"
    angle: "Курс 'Пробуждение', практики настоящего момента, возвращение к себе"
    health_sensitive: false

